<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주식 양도소득세 계산기</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>주식 양도소득세 계산기</h1>

        <!-- 입력 블록 -->
        <div class="input-block">
            <form id="taxCalculator">
                <!-- 기본 정보 -->
                <section class="form-section">
                    <h2>기본 정보</h2>

                    <div class="form-group">
                        <label>대주주 여부</label>
                        <div class="button-group">
                            <button type="button" class="option-btn active" data-group="majorShareholder" data-value="major">대주주</button>
                            <button type="button" class="option-btn" data-group="majorShareholder" data-value="non-major">대주주 외</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>기업 구분</label>
                        <div class="button-group">
                            <button type="button" class="option-btn active" data-group="companyType" data-value="sme">중소기업</button>
                            <button type="button" class="option-btn" data-group="companyType" data-value="non-sme">중소기업 외</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>상장 여부</label>
                        <div class="button-group">
                            <button type="button" class="option-btn active" data-group="listingStatus" data-value="listed">상장</button>
                            <button type="button" class="option-btn" data-group="listingStatus" data-value="unlisted">비상장</button>
                        </div>
                    </div>
                </section>

                <!-- 양도 정보 -->
                <section class="form-section">
                    <h2>양도 정보</h2>

                    <div class="form-group">
                        <label for="transferDate">양도일자</label>
                        <input type="date" id="transferDate" required>
                    </div>

                    <div class="form-group">
                        <label for="transferShares">양도주식 수</label>
                        <input type="text" id="transferShares" placeholder="예: 1000" required>
                        <div class="korean-display" id="transferSharesKorean"></div>
                    </div>

                    <div class="form-group">
                        <label for="transferPricePerShare">주당 양도가액</label>
                        <input type="text" id="transferPricePerShare" placeholder="예: 50000" required>
                        <div class="korean-display" id="transferPricePerShareKorean"></div>
                    </div>
                </section>

                <!-- 취득 정보 -->
                <section class="form-section">
                    <h2>취득 정보</h2>

                    <div class="form-group">
                        <label for="acquisitionDate">취득일자</label>
                        <input type="date" id="acquisitionDate" required>
                    </div>

                    <div class="form-group">
                        <label for="acquisitionShares">취득주식 수</label>
                        <input type="text" id="acquisitionShares" placeholder="예: 1000" required>
                        <div class="korean-display" id="acquisitionSharesKorean"></div>
                    </div>

                    <div class="form-group">
                        <label for="acquisitionPricePerShare">주당 취득가액</label>
                        <input type="text" id="acquisitionPricePerShare" placeholder="예: 30000" required>
                        <div class="korean-display" id="acquisitionPricePerShareKorean"></div>
                    </div>
                </section>

                <!-- 기본공제 -->
                <section class="form-section">
                    <h2>기본공제</h2>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="basicDeduction" checked>
                            <span>기본공제 250만원 적용</span>
                        </label>
                    </div>
                </section>

                <!-- 계산 버튼 -->
                <button type="button" id="calculateBtn" class="calculate-btn">계산하기</button>
            </form>
        </div>

        <!-- 결과 블록 (표 형식) -->
        <div class="result-block" id="resultBlock" style="display: none;">
            <h2>계산 결과</h2>

            <table class="result-table">
                <thead>
                    <tr>
                        <th>구분</th>
                        <th>날짜</th>
                        <th>금액</th>
                        <th>비고</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td class="label-col">양도가액</td>
                        <td id="resultTransferDate">-</td>
                        <td id="resultTransferAmount" class="amount-col">-</td>
                        <td id="resultTransferNote">-</td>
                    </tr>
                    <tr>
                        <td class="label-col">취득가액</td>
                        <td id="resultAcquisitionDate">-</td>
                        <td id="resultAcquisitionAmount" class="amount-col">-</td>
                        <td id="resultAcquisitionNote">-</td>
                    </tr>
                    <tr>
                        <td class="label-col">필요경비</td>
                        <td>-</td>
                        <td id="resultExpenses" class="amount-col">-</td>
                        <td id="resultExpensesNote">증권거래세</td>
                    </tr>
                    <tr>
                        <td class="label-col">양도차익</td>
                        <td>-</td>
                        <td id="resultCapitalGain" class="amount-col">-</td>
                        <td id="resultCapitalGainNote">양도가액 - 취득가액 - 필요경비</td>
                    </tr>
                    <tr>
                        <td class="label-col">기본공제</td>
                        <td>-</td>
                        <td id="resultBasicDeduction" class="amount-col">-</td>
                        <td id="resultBasicDeductionNote">-</td>
                    </tr>
                    <tr>
                        <td class="label-col">과세표준</td>
                        <td>-</td>
                        <td id="resultTaxBase" class="amount-col">-</td>
                        <td id="resultTaxBaseNote">양도차익 - 기본공제</td>
                    </tr>
                    <tr>
                        <td class="label-col">세율</td>
                        <td>-</td>
                        <td id="resultTaxRate" class="amount-col">-</td>
                        <td id="resultTaxRateNote">-</td>
                    </tr>
                    <tr class="highlight-row">
                        <td class="label-col">양도소득세</td>
                        <td>-</td>
                        <td id="resultCapitalGainTax" class="amount-col">-</td>
                        <td id="resultCapitalGainTaxNote">과세표준 × 세율</td>
                    </tr>
                    <tr class="highlight-row">
                        <td class="label-col">지방소득세</td>
                        <td>-</td>
                        <td id="resultLocalTax" class="amount-col">-</td>
                        <td id="resultLocalTaxNote">양도소득세 × 10%</td>
                    </tr>
                    <tr class="total-row">
                        <td class="label-col">합계 세액</td>
                        <td>-</td>
                        <td id="resultTotalTax" class="amount-col">-</td>
                        <td id="resultTotalTaxNote">양도소득세 + 지방소득세</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="calculator.js"></script>
</body>
</html>
